"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

format = """
[](magenta)\
$os\
$username\
[](bg:#282828 fg:magenta)\
$directory\
[](fg:#282828 bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:flamingo)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:flamingo bg:surface2)\
$docker_context\
$conda\
$pixi\
[](fg:surface2 bg:#282828)\
$time\
[ ](fg:#282828)\
$line_break$character"""

# palette = "gruvbox_dark"

[palettes.gruvbox_dark]
text = "#fbf1c7"
surface0 = "#3c3836"
surface2 = "#665c54"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
flamingo = "#d65d0e"
magenta = "#b16286"
red = "#cc241d"
yellow = "#d79921"

[os]
disabled = false
style = "bg:magenta fg:base"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
NixOS = " "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[username]
show_always = true
style_user = "bg:magenta fg:base"
style_root = "bg:magenta fg:base"
format = "[$user ]($style)"

[directory]
style = "fg:text bg:#282828"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = "[[ $symbol $branch ](fg:base bg:yellow)]($style)"

[git_status]
style = "bg:yellow"
format = "[[($all_status$ahead_behind )](fg:base bg:yellow)]($style)"

[nodejs]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:text bg:flamingo)]($style)"

[bun]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:text bg:flamingo)]($style)"

[c]
symbol = " "
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[cpp]
symbol = " "
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[rust]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[golang]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[php]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[java]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[jj_bookmark]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:base bg:cyan)]($style)'

[jj_status]
style = "bg:cyan"
format = "[[($all )](fg:base bg:cyan)]($style)"

[kotlin]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[haskell]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[python]
symbol = ""
style = "bg:flamingo"
format = "[[ $symbol( $version) ](fg:base bg:flamingo)]($style)"

[docker_context]
symbol = ""
style = "bg:surface2"
format = "[[ $symbol( $context) ](fg:#83a598 bg:surface2)]($style)"

[conda]
style = "bg:surface2"
format = "[[ $symbol( $environment) ](fg:#83a598 bg:surface2)]($style)"

[pixi]
style = "bg:surface2"
format = "[[ $symbol( $version)( $environment) ](fg:text bg:surface2)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:surface0"
format = "[[  $time ](fg:text bg:#282828)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:green)"
error_symbol = "[](bold fg:red)"
vimcmd_symbol = "[](bold fg:green)"
vimcmd_replace_one_symbol = "[](bold fg:magenta)"
vimcmd_replace_symbol = "[](bold fg:magenta)"
vimcmd_visual_symbol = "[](bold fg:yellow)"

